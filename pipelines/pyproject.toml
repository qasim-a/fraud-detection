[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fraud-pipelines"
version = "0.1.0"
description = "Spark feature engineering and fraud model training pipelines"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "pydantic-settings>=2.10,<3",
  "pyspark[sql]>=4.2,<4.3",
  "scikit-learn>=1.7,<2",
  "typer>=0.16,<1",
  "xgboost>=3.0,<4",
]

[project.scripts]
fraud-pipelines = "fraud_pipelines.cli:app"

[dependency-groups]
dev = [
  "pyright>=1.1.403",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_pipelines"]
