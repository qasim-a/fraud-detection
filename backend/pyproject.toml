[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fraud-api"
version = "0.1.0"
description = "Low-latency fraud scoring and analyst review API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "python-json-logger>=3.3,<4",
  "shap>=0.48,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "xgboost>=3.0,<4",
]

[dependency-groups]
dev = [
  "pyright>=1.1.403",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "testcontainers[postgres]>=4.10,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_api"]
